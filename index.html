<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>今期アニメ 声優検索</title>
<style>
:root{color-scheme:light;--bg:#f7f5f2;--surface:#fff;--surface-soft:#f1eeea;--tx:#252321;--sub:#817b75;--accent:#7958d6;--accent-dark:#6041b9;--accent-soft:#eee8fc;--line:#eae6e1;--shadow:0 18px 50px rgba(46,34,24,.07)}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#17151b;--surface:#211e26;--surface-soft:#2b2731;--tx:#f5f1f8;--sub:#b1aab9;--accent:#b4a0ff;--accent-dark:#c9bcff;--accent-soft:#342d46;--line:#37323d;--shadow:0 18px 50px rgba(0,0,0,.18)}}
*{box-sizing:border-box}
body{min-width:320px;margin:0;background:var(--bg);color:var(--tx);font:15px/1.65 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
header{position:relative;overflow:hidden;padding:calc(env(safe-area-inset-top) + 20px) 24px 42px;background:radial-gradient(ellipse at 90% 0%,rgba(255,255,255,.18),transparent 34%),linear-gradient(135deg,#6849bf,#9271e5 58%,#aa8ce9);color:#fff}
header:after{position:absolute;content:"";width:280px;height:280px;right:-100px;bottom:-210px;border:1px solid rgba(255,255,255,.2);border-radius:50%;box-shadow:0 0 0 28px rgba(255,255,255,.04),0 0 0 58px rgba(255,255,255,.04)}
.topbar,.hero,.search-wrap{position:relative;z-index:1;max-width:920px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:750;letter-spacing:.04em}
.brand-mark{display:grid;width:34px;height:34px;place-items:center;border:1px solid rgba(255,255,255,.36);border-radius:12px;background:rgba(255,255,255,.15);font-size:17px}
.season{padding:5px 11px;border:1px solid rgba(255,255,255,.34);border-radius:999px;background:rgba(255,255,255,.12);font-size:12px;font-weight:650}
.hero{padding:34px 0 22px}
.eyebrow{margin:0 0 8px;color:rgba(255,255,255,.78);font-size:12px;font-weight:700;letter-spacing:.16em}
h1{margin:0;font-size:clamp(30px,6vw,44px);font-weight:800;letter-spacing:.015em;line-height:1.25}
.lead{margin:10px 0 0;color:rgba(255,255,255,.82);font-size:14px}
.search-wrap{display:flex;align-items:center;gap:12px;padding:7px 8px 7px 17px;border:1px solid rgba(255,255,255,.55);border-radius:17px;background:#fff;box-shadow:0 14px 34px rgba(49,31,91,.2);color:#312a3b}
.search-icon{flex:none;color:#8d7aa9}
input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#312a3b;font:inherit;font-size:15px}
input::placeholder{color:#9e97a5}
input:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
main{width:min(100% - 40px,920px);min-height:45vh;margin:0 auto;padding:30px 0 52px}
.list-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 16px}
.section-title{margin:0;font-size:17px;font-weight:750;letter-spacing:.02em}
.hint{color:var(--sub);font-size:13px}
#list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.item{display:flex;align-items:center;gap:13px;width:100%;min-width:0;padding:15px;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 12px rgba(46,34,24,.025);cursor:pointer;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.item:hover{transform:translateY(-2px);border-color:rgba(121,88,214,.4);box-shadow:var(--shadow)}
.item:focus-visible,.back:focus-visible,.vod:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.item .avatar{display:grid;flex:none;width:44px;height:44px;place-items:center;border-radius:14px;background:var(--accent-soft);color:var(--accent-dark);font-size:18px;font-weight:800}
.item-copy{display:grid;min-width:0;gap:1px}
.item b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:750}
.item span{color:var(--sub);font-size:12px}
.count{flex:none;margin-left:auto;padding:4px 8px;border-radius:999px;background:var(--surface-soft);color:var(--sub);font-size:11px}
.empty{grid-column:1/-1;padding:32px 16px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--sub)}
.back{margin:0 0 20px;padding:0;border:0;background:none;color:var(--accent-dark);font:inherit;font-weight:700;cursor:pointer}
.who{margin:0 0 24px;padding:24px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,var(--surface),var(--accent-soft))}
.who h2{margin:0;font-size:28px;letter-spacing:.02em;line-height:1.35}.who span{color:var(--sub);font-size:14px}
.detail-label{margin:0 0 12px 2px;font-size:14px;font-weight:750}
.work{margin-bottom:12px;padding:19px;border:1px solid var(--line);border-radius:17px;background:var(--surface);box-shadow:0 4px 18px rgba(46,34,24,.03)}
.work h3{margin:0 0 5px;font-size:16px;line-height:1.5}.work p{margin:0 0 13px;color:var(--sub);font-size:13px}
.role{display:inline-flex;padding:4px 9px;border-radius:999px;background:var(--surface-soft);color:var(--sub);font-size:12px}
.vod{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:9px;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--surface-soft);color:var(--tx);font-size:13px;font-weight:700;text-align:center;text-decoration:none;transition:background .18s ease,border-color .18s ease}
.vod:hover{border-color:var(--accent);background:var(--accent-soft)}
.none{color:var(--sub);font-size:13px}
footer{padding:20px 20px 30px;color:var(--sub);font-size:11px;text-align:center}
[hidden]{display:none!important}
@media(max-width:600px){header{padding-right:20px;padding-left:20px;padding-bottom:30px}.hero{padding-top:29px}.lead{font-size:13px}main{width:min(100% - 32px,480px);padding-top:24px}#list{grid-template-columns:1fr;gap:9px}.item{padding:12px}.avatar{width:42px;height:42px}.list-head{align-items:flex-start;flex-direction:column;gap:2px}.who{padding:20px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">声</span>こえさがし</div>
    <span class="season" id="season"></span>
  </div>
  <div class="hero">
    <p class="eyebrow">ANIME VOICE CAST</p>
    <h1>好きな声優から、<br>作品に出会おう。</h1>
    <p class="lead">今期アニメの出演声優と作品をかんたん検索。</p>
  </div>
  <label class="search-wrap" for="q">
    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="声優名・ひらがなで検索" autocomplete="off" enterkeyhint="search">
  </label>
</header>
<main>
  <section id="s1"><div class="list-head"><h2 class="section-title">出演声優</h2><div class="hint" id="hint"></div></div><div id="list"></div></section>
  <section id="s2" hidden></section>
</main>
<footer>※本ページのリンクにはアフィリエイトを含みます。配信状況は各サービスでご確認ください。</footer>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 全角半角・カタカナ/ひらがな・空白や中黒を正規化
const norm=s=>s.normalize('NFKC').toLowerCase().replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-96)).replace(/[\s・･]/g,'');
let D,A=[];

fetch('data.json').then(r=>r.json()).then(d=>{
  D=d;A=d.voice_actors.map(a=>({...a,k:norm(a.name+a.reading)}));
  $('#season').textContent=d.season.replace('-',' ');
  route();
}).catch(()=>{$('#list').textContent='data.json を読み込めませんでした。ローカル確認時は簡易サーバー経由で開いてください。'});

function list(){
  const q=norm($('#q').value),r=q?A.filter(a=>a.k.includes(q)):A;
  $('#hint').textContent=q?`${r.length}名が見つかりました`:`全${A.length}名`;
  $('#list').innerHTML=r.length?r.map(a=>`<button class="item" data-id="${esc(a.actor_id)}"><span class="avatar" aria-hidden="true">${esc(a.name.slice(0,1))}</span><span class="item-copy"><b>${esc(a.name)}</b><span>${esc(a.reading)}</span></span><span class="count">${a.roles.length}作品</span></button>`).join(''):'<div class="empty">該当する声優が見つかりませんでした。<br>ひらがなでもお試しください。</div>';
}
function detail(a){
  $('#s2').innerHTML=`<button class="back" id="bk">← 声優一覧にもどる</button>
  <div class="who"><h2>${esc(a.name)}</h2><span>${esc(a.reading)}</span></div>
  <h3 class="detail-label">出演作品 <span class="hint">${a.roles.length}作品</span></h3>`+
  a.roles.map(r=>{const w=D.works[r.work_id];return `<div class="work"><h3>${esc(w.title)}</h3><p><span class="role">役名：${esc(r.character_name)}</span></p>`+
    (w.vod_links.length?w.vod_links.map(v=>`<a class="vod" href="${esc(v.url)}" target="_blank" rel="sponsored noopener">${esc(v.provider)}で見る</a>`).join(''):'<div class="none">配信情報は準備中です</div>')+'</div>'}).join('');
  $('#bk').onclick=()=>history.back();
}
function route(){
  const id=location.hash.slice(1),a=A.find(x=>x.actor_id===id);
  $('#s1').hidden=!!a;$('#s2').hidden=!a;
  if(a){detail(a);scrollTo(0,0)}else list();
}
$('#q').addEventListener('input',list);
$('#list').addEventListener('click',e=>{const b=e.target.closest('.item');if(b){$('#q').blur();location.hash=b.dataset.id}});
addEventListener('hashchange',route);
</script>
</body>
</html>
