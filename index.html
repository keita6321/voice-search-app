<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f2">
<title>ANIME CAST NOW｜2026年秋アニメの声優検索</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f7f2;--sf:#fff;--tx:#192944;--sub:#827f77;--ln:#deddd7;--ac:#62517f;--r:16px;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.55 "Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:auto;padding:0 24px}

/* ---- 検索画面 ---- */
.top{text-align:center;padding:calc(env(safe-area-inset-top) + 34px) 0 18px}
.brand{display:flex;align-items:center;justify-content:center;gap:1px;color:var(--tx);font-family:Arial,sans-serif;font-size:clamp(24px,8vw,48px);font-weight:900;line-height:1;letter-spacing:.015em}
.brand svg{width:.78em;height:.92em;flex:none;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tagline{margin:4px 0 28px!important;color:var(--tx)!important;font-size:14px!important;font-weight:700;letter-spacing:.12em}
.season-info{display:flex;align-items:center;justify-content:center;gap:10px;width:max-content;margin:8px auto 0;padding:10px 18px;border-radius:999px;background:var(--ac)}
.season-label{color:rgba(255,255,255,.82);font-size:12px;font-weight:700;line-height:1.4;letter-spacing:.04em}
.top h1{margin:0;text-align:left;color:#fff;font-size:18px;line-height:1.4;font-weight:900;letter-spacing:.01em;display:flex;align-items:center;transform:translateY(-1px)}
.top p{margin:0;color:var(--sub);font-size:13px}
.sbar{position:sticky;top:0;z-index:4;padding:8px 0 12px;background:linear-gradient(var(--bg) 75%,transparent)}
.sbox{display:flex;align-items:center;gap:10px;background:var(--sf);border-radius:999px;padding:0 8px 0 16px;box-shadow:0 2px 8px rgba(35,42,53,.04);border:1.5px solid var(--ln);transition:border-color .15s}
.sbox:focus-within{border-color:var(--ac)}
.sbox svg{flex:none;width:22px;height:22px;stroke:var(--sub);fill:none;stroke-width:2.4;stroke-linecap:round}
#q{flex:1;min-width:0;border:0;background:none;color:var(--tx);font:inherit;font-size:15px;font-weight:500;padding:13px 0;outline:none}
#q::placeholder{color:#99968f;font-weight:400}
#q::-webkit-search-cancel-button{display:none}
#clr{width:34px;height:34px;border:0;border-radius:50%;background:var(--bg);font-size:16px;line-height:1;color:var(--sub)}
.vod-filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.vod-filter{min-height:40px;padding:6px 15px;border:1px solid var(--ac);border-radius:999px;background:transparent;color:var(--ac);font-size:14px;font-weight:700;line-height:1.2;white-space:nowrap}
.vod-filter[aria-pressed="true"]{background:var(--ac);color:#fff}
.vod-filter:active{transform:scale(.97)}
.filter-status{margin:0 0 6px;color:var(--tx);font-size:12px;font-weight:700}
.cnt{padding:3px 4px 10px;font-size:12px;color:var(--sub);font-weight:500}
#list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row{display:flex;align-items:center;gap:10px;min-width:0;min-height:62px;padding:7px 12px;border:0;border-radius:13px;background:var(--sf);text-align:left;box-shadow:0 2px 6px rgba(35,42,53,.12);transition:transform .12s,box-shadow .12s}
.row:active{transform:scale(.985);box-shadow:0 1px 3px rgba(35,42,53,.1)}
.nm{flex:1;min-width:0}.nm b{display:block;overflow:hidden;font-size:15px;font-weight:700;line-height:1.35;text-overflow:ellipsis;white-space:nowrap}
.service-marks{display:flex;flex:none;align-items:center;gap:3px}
.service-mark{display:grid;width:22px;height:22px;place-items:center;overflow:hidden;border-radius:6px;background:var(--service-color);color:var(--service-text,#fff);font:900 12px/1 Arial,sans-serif}
.service-mark.prime{font-size:7px;letter-spacing:-.06em}
.service-mark.danime{font-size:13px}
.service-more{color:var(--sub);font-size:10px;white-space:nowrap}
.role-count{flex:none;color:var(--sub);font-size:11px;font-weight:500;white-space:nowrap}
.row .ch{flex:none;width:8px;height:8px;border-right:1.7px solid var(--sub);border-top:1.7px solid var(--sub);transform:rotate(45deg);opacity:.75}
.empty{grid-column:1/-1;padding:40px 20px;text-align:center;color:var(--sub)}.empty b{display:block;font-size:17px;color:var(--tx);margin-bottom:4px}

/* ---- 声優詳細モーダル ---- */
#s2{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(26,31,42,.58)}
#s2[hidden]{display:none}
.dialog{display:flex;flex-direction:column;width:min(100%,900px);max-height:min(90dvh,900px);overflow:hidden;border:1px solid rgba(25,41,68,.12);border-radius:18px;background:var(--bg);box-shadow:0 20px 60px rgba(10,15,25,.28)}
.detail-head{flex:none;padding:12px 18px 14px;border-bottom:1px solid var(--ln)}
.detail-bar{display:flex;align-items:center;justify-content:space-between;min-height:32px}
.detail-brand{font-family:Arial,sans-serif;font-size:15px;font-weight:900;letter-spacing:.04em}
.back{display:inline-flex;align-items:center;gap:5px;padding:4px 0;border:0;background:none;color:var(--tx);font-size:12px;font-weight:700}
.back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.modal-close{display:none}
.profile{margin-top:10px}
.profile-copy{min-width:0}
.profile h2{margin:0;font-size:25px;line-height:1.2;font-weight:900;letter-spacing:-.02em;overflow-wrap:anywhere}
.profile small{display:block;margin-top:2px;color:var(--sub);font-size:12px;line-height:1.3}
.profile em{display:inline-block;margin-top:5px;padding:3px 9px;border-radius:999px;background:#eeeaf3;color:var(--ac);font-size:11px;font-style:normal;font-weight:700;line-height:1.3}
.modal-scroll{min-height:0;overflow:auto;overscroll-behavior:contain;padding:12px 16px 20px}
.modal-scroll>h3{margin:0 2px 9px;font-size:13px;font-weight:900}
.work-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.work{min-width:0;padding:13px;border:1px solid #ebe9e3;border-radius:13px;background:var(--sf);box-shadow:0 2px 6px rgba(35,42,53,.06)}
.work h4{display:-webkit-box;overflow:hidden;margin:0 0 3px;font-size:15px;line-height:1.3;font-weight:900;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.cr{overflow:hidden;margin:0 0 3px;color:var(--sub);font-size:10px;text-overflow:ellipsis;white-space:nowrap}
.castline{overflow:hidden;margin:0 0 7px;color:var(--sub);font-size:11px;line-height:1.35;text-overflow:ellipsis;white-space:nowrap}
.castline b{color:var(--tx);font-weight:700}
.vods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.vod{display:flex;align-items:center;justify-content:center;min-width:0;min-height:44px;padding:5px 4px;border:1px solid #d8d0e4;border-radius:9px;background:#f3f0f7;color:var(--ac);text-decoration:none;text-align:center;font-size:10px;font-weight:700;line-height:1.2;overflow-wrap:anywhere;transition:transform .12s,background .12s}
.vod:active{transform:scale(.97);background:#e8e2f0}
.soon{padding:8px 5px;border-radius:9px;background:var(--bg);color:var(--sub);font-size:11px;text-align:center}
.off{display:block;margin-top:6px;color:var(--sub);font-size:10px;text-align:center;text-decoration:none}
.off:after{content:" ↗"}
.modal-empty{grid-column:1/-1;padding:24px;text-align:center;color:var(--sub)}
body.modal-open{overflow:hidden}
.pr{padding:24px 4px 30px;font-size:11px;color:var(--sub);text-align:center}
#sub{font-size:18px;font-weight:900;color:#fff;margin:0;line-height:1.4}#scope{margin-top:4px}
@media(max-width:540px){.wrap{padding:0 16px}#list{grid-template-columns:1fr}.row{min-height:60px}.role-count{font-size:12px}#s2{padding:12px}.dialog{width:100%;max-height:94dvh;border-radius:16px}.detail-head{padding:10px 13px 12px}.modal-scroll{padding:10px 11px 16px}.work-grid{gap:8px}.work{padding:10px}.work h4{font-size:13px}.castline{font-size:10px}.vod{font-size:9px;min-height:44px}}
@media(max-width:360px){#s2{padding:0}.dialog{height:100dvh;max-height:100dvh;border:0;border-radius:0}.work-grid{grid-template-columns:1fr 1fr;gap:6px}.work{padding:6px}.vods{gap:4px}.vod{font-size:9px}}
@media(max-width:400px){.top{padding-top:calc(env(safe-area-inset-top) + 24px)}.tagline{margin-bottom:22px!important}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
 <section id="s1">
  <div class="top"><div class="brand" aria-label="ANIME CAST NOW"><span>ANIME CAST N</span><svg viewBox="0 0 24 30" aria-hidden="true"><rect x="8" y="2" width="8" height="16" rx="4"/><path d="M4 13v1a8 8 0 0 0 16 0v-1M12 22v5m-4 0h8"/></svg><span>W</span></div><p class="tagline">あの声優、今期なにに出てる？</p><div class="season-info"><span class="season-label">検索対象シーズン</span><h1 id="sub">2026年 秋アニメ</h1></div></div>
  <div class="sbar"><label class="sbox">
   <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
   <input id="q" type="search" placeholder="今期の声優を名前・ひらがなで検索" autocomplete="off" enterkeyhint="search" aria-label="声優を検索">
   <button id="clr" type="button" hidden aria-label="入力を消す">✕</button></label></div>
  <div class="vod-filters" id="vod-filters" role="group" aria-label="配信サービスで絞り込み"></div>
  <div class="filter-status" id="filter-status" aria-live="polite">フィルター：すべての配信</div>
  <div class="cnt" id="cnt">今期放送中の声優（あいうえお順）</div>
  <div id="list"></div>
 </section>
 <section id="s2" hidden></section>
 <div class="pr">本ページのリンクにはアフィリエイトを含みます。配信状況は各サービスでご確認ください。</div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.normalize('NFKC').toLowerCase().replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-96)).replace(/[\s・･]/g,'');
// サービスごとのブランド色（c:背景 t:文字）。未登録はアクセント色
const BR={'Amazon Prime Video':{c:'#0a7bc4'},'Netflix':{c:'#e50914'},'U-NEXT':{c:'#1d1d1f'},'dアニメストア':{c:'#ef4b39'},'Hulu':{c:'#1ce783',t:'#04200f'},'ABEMA':{c:'#34d96b',t:'#06210f'},'DMM TV':{c:'#1e3a8a'},'アニメ放題':{c:'#f08300'},'アニメタイムズ':{c:'#7c3aed'}};
const SERVICE_ORDER=['Amazon Prime Video','U-NEXT','DMM TV','Hulu','Netflix'];
const SERVICE_LABEL={'Amazon Prime Video':'Prime Video'};
const SERVICE_MARK={'Amazon Prime Video':'▶','Netflix':'N','dアニメストア':'d','U-NEXT':'U','Hulu':'h','ABEMA':'A','DMM TV':'D','アニメ放題':'放','アニメタイムズ':'AT'};
const serviceLabel=name=>SERVICE_LABEL[name]||name;
let D,A=[],WORK_COUNT=0,SERVICES=[],selectedService='',SERVICE_WORK_COUNTS={};

fetch('data.json').then(r=>r.json()).then(d=>{
  D=d;WORK_COUNT=Object.keys(d.works).length;
  SERVICES=SERVICE_ORDER.filter(s=>Object.values(d.works).some(w=>w.vod_links.some(v=>v.provider===s)));
  SERVICE_WORK_COUNTS=Object.fromEntries(SERVICES.map(s=>[s,Object.values(d.works).filter(w=>w.vod_links.some(v=>v.provider===s)).length]));
  A=d.voice_actors.map(a=>({...a,k:norm(a.name+a.reading),services:[...new Set(a.roles.flatMap(r=>d.works[r.work_id].vod_links.map(v=>v.provider)))]}));
  renderVodFilters();
  const [y,s]=d.season.split('-'),M={winter:['冬','1〜3月'],spring:['春','4〜6月'],summer:['夏','7〜9月'],autumn:['秋','10〜12月'],fall:['秋','10〜12月']}[s]||[s,''];
  const dt=new Date(d.updated_at).toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric'});
  $('#sub').textContent=`${y}年 ${M[0]}アニメ`;
  $('#cnt').textContent=`今季出演中の声優（あいうえお順）・${A.length}名／${WORK_COUNT}作品`;
  route();
}).catch(()=>{$('#list').innerHTML='<div class="empty"><b>データを読み込めませんでした</b>data.json を同じ場所に置き、サーバー経由で開いてください。</div>'});

function list(){
  const v=$('#q').value,q=norm(v),r=A.filter(a=>(!selectedService||a.services.includes(selectedService))&&(!q||a.k.includes(q)));
  $('#clr').hidden=!v;
  const workCount=selectedService?SERVICE_WORK_COUNTS[selectedService]:WORK_COUNT;
  $('#filter-status').textContent=`フィルター：${selectedService?serviceLabel(selectedService):'すべての配信'}`;
  $('#cnt').textContent=q?(r.length?`${r.length}名が見つかりました／${selectedService?serviceLabel(selectedService)+'配信':'検索対象'}${workCount}作品`:`検索結果はありません／${selectedService?serviceLabel(selectedService)+'配信':'検索対象'}${workCount}作品`):selectedService?`${serviceLabel(selectedService)}で配信中の声優（あいうえお順）・${r.length}名／${workCount}作品`:`今季出演中の声優（あいうえお順）・${r.length}名／${WORK_COUNT}作品`;
  $('#list').innerHTML=r.length?r.map(a=>`<button class="row" data-id="${esc(a.actor_id)}"><span class="nm"><b>${esc(a.name)}</b></span><span class="service-marks" aria-label="${a.services.map(serviceLabel).join('、')}で配信">${a.services.slice(0,3).map(s=>{const b=BR[s]||{};return `<span class="service-mark ${s==='Amazon Prime Video'?'prime':s==='dアニメストア'?'danime':''}" style="--service-color:${b.c||'var(--ac)'};--service-text:${b.t||'#fff'}" title="${esc(serviceLabel(s))}" aria-hidden="true">${esc(SERVICE_MARK[s]||serviceLabel(s)[0])}</span>`}).join('')}${a.services.length>3?`<span class="service-more">+${a.services.length-3}</span>`:''}</span><span class="role-count">${a.roles.length}件出演</span><i class="ch" aria-hidden="true"></i></button>`).join(''):`<div class="empty"><b>${q?(selectedService?`${serviceLabel(selectedService)}で配信中の作品に「${esc(v)}」は見つかりません`:`「${esc(v)}」は今期の作品に見つかりません`):'このサービスで配信中の作品に出演する声優はいません'}</b>${q?(selectedService?'名前の一部やひらがなで検索できます。':'過去作・来期作は対象外です。名前の一部やひらがなでも探せます。'):''}</div>`;
}
function renderVodFilters(){
  $('#vod-filters').innerHTML=`<button class="vod-filter" type="button" data-service="" aria-pressed="true">すべての配信</button>`+SERVICES.map(s=>`<button class="vod-filter" type="button" data-service="${esc(s)}" aria-pressed="false">${esc(serviceLabel(s))}</button>`).join('');
}
function closeDetail(){if(history.length>1)history.back();else location.hash=''}
function detail(a){
  $('#s2').innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="detail-name" tabindex="-1">
  <header class="detail-head"><div class="detail-bar"><button class="back" id="bk" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>声優一覧へ戻る</span></button><span class="detail-brand">ANIME CAST NOW</span><span aria-hidden="true"></span></div>
  <div class="profile"><div class="profile-copy"><h2 id="detail-name">${esc(a.name)}</h2><small>${esc(a.reading)}</small><em>今季 ${a.roles.length}作品に出演中</em></div></div></header>
  <div class="modal-scroll"><h3>今季の出演作品</h3><div class="work-grid">`+a.roles.map(r=>{const w=D.works[r.work_id];
   return `<article class="work"><h4>${esc(w.title)}</h4>${w.credit?`<div class="cr">${esc(w.credit)}</div>`:''}
   <div class="castline"><b>${esc(r.character_name)}</b> ／ ${esc(a.name)}</div>`+
   (w.vod_links.length?`<div class="vods">`+w.vod_links.map(v=>`<a class="vod" href="${esc(v.url)}" target="_blank" rel="sponsored noopener">${esc(v.provider)}で見る</a>`).join('')+`</div>`:'<div class="soon">配信情報は準備中です</div>')+
   ((r.official_url||w.official_url)?`<a class="off" href="${esc(r.official_url||w.official_url)}" target="_blank" rel="noopener">公式サイト</a>`:'')+'</article>'}).join('')+`</div></div></div>`;
  $('#bk').onclick=closeDetail;
  $('#s2').querySelector('.dialog').focus();
}
function route(){
  const a=A.find(x=>x.actor_id===location.hash.slice(1));
  $('#s1').hidden=false;$('#s2').hidden=!a;document.body.classList.toggle('modal-open',!!a);
  if(a)detail(a);else list();
}
$('#q').addEventListener('input',list);
$('#clr').onclick=()=>{$('#q').value='';list();$('#q').focus()};
$('#vod-filters').addEventListener('click',e=>{const b=e.target.closest('.vod-filter');if(b){selectedService=b.dataset.service;$('#vod-filters').querySelectorAll('.vod-filter').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));list()}});
$('#list').addEventListener('click',e=>{const b=e.target.closest('.row');if(b){$('#q').blur();location.hash=b.dataset.id}});
$('#s2').addEventListener('click',e=>{if(e.target===$('#s2'))closeDetail()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#s2').hidden)closeDetail()});
addEventListener('hashchange',route);
// 画像の読み込み失敗時は<img>を外し、下のプレースホルダーを見せる
addEventListener('error',e=>{if(e.target.tagName==='IMG')e.target.remove()},true);
</script>
</body>
</html>
